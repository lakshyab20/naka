<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="The five jobs of the Naka guard"><title>The five jobs of the Naka guard</title><rect width="960" height="400" rx="18" fill="#F7F5EF"/><rect x="24" y="24" width="172" height="352" rx="16" fill="#FFFFFF" stroke="#DCD7CC" stroke-width="1.5"/><text x="42" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5A6270" text-anchor="start"><tspan x="42" dy="0">1</tspan></text><rect x="76.0" y="104" width="68" height="50" rx="8" fill="none" stroke="#10151B" stroke-width="4"/><circle cx="98.0" cy="126" r="9" fill="#10151B"/><rect x="114.0" y="120" width="20" height="4" rx="2" fill="#10151B"/><rect x="114.0" y="130" width="14" height="4" rx="2" fill="#10151B"/><text x="42" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#10151B" text-anchor="start"><tspan x="42" dy="0">Checks IDs</tspan></text><text x="42" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5A6270" text-anchor="start"><tspan x="42" dy="0">Remembers every</tspan><tspan x="42" dy="19">tool as it was on</tspan><tspan x="42" dy="19">day one. A changed</tspan><tspan x="42" dy="19">tool is blocked.</tspan></text><rect x="209" y="24" width="172" height="352" rx="16" fill="#FFFFFF" stroke="#DCD7CC" stroke-width="1.5"/><text x="227" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5A6270" text-anchor="start"><tspan x="227" dy="0">2</tspan></text><circle cx="289.0" cy="124" r="22" fill="none" stroke="#10151B" stroke-width="5"/><line x1="305.0" y1="140" x2="325.0" y2="160" stroke="#10151B" stroke-width="7" stroke-linecap="round"/><text x="227" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#10151B" text-anchor="start"><tspan x="227" dy="0">Spots tricks</tspan></text><text x="227" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5A6270" text-anchor="start"><tspan x="227" dy="0">Catches notes like</tspan><tspan x="227" dy="19">“ignore your</tspan><tspan x="227" dy="19">instructions”.</tspan><tspan x="227" dy="19">A first filter only.</tspan></text><rect x="394" y="24" width="172" height="352" rx="16" fill="#0F766E"/><text x="412" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="412" dy="0">3</tspan></text><g transform="translate(458.0,130) scale(1.1)"><circle cx="0" cy="0" r="11" fill="none" stroke="#FFFFFF" stroke-width="5"/><path d="M10,0 H40 M30,0 V10 M38,0 V8" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/></g><text x="412" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="412" dy="0">Follows secrets</tspan></text><text x="412" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="412" dy="0">Remembers the</tspan><tspan x="412" dy="19">passwords the AI</tspan><tspan x="412" dy="19">has seen. Stops</tspan><tspan x="412" dy="19">them leaving, even</tspan><tspan x="412" dy="19">in disguise.</tspan></text><rect x="579" y="24" width="172" height="352" rx="16" fill="#FFFFFF" stroke="#DCD7CC" stroke-width="1.5"/><text x="597" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5A6270" text-anchor="start"><tspan x="597" dy="0">4</tspan></text><path d="M631.0,100 H699.0 V144 H661.0 L645.0,160 V144 H631.0 Z" fill="none" stroke="#10151B" stroke-width="4" stroke-linejoin="round"/><text x="665.0" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#10151B" text-anchor="middle"><tspan x="665.0" dy="0">OK?</tspan></text><text x="597" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#10151B" text-anchor="start"><tspan x="597" dy="0">Asks you first</tspan></text><text x="597" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5A6270" text-anchor="start"><tspan x="597" dy="0">Payments, unlocking,</tspan><tspan x="597" dy="19">a stranger’s address:</tspan><tspan x="597" dy="19">nothing happens</tspan><tspan x="597" dy="19">without your OK.</tspan></text><rect x="764" y="24" width="172" height="352" rx="16" fill="#FFFFFF" stroke="#DCD7CC" stroke-width="1.5"/><text x="782" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5A6270" text-anchor="start"><tspan x="782" dy="0">5</tspan></text><path d="M838.0,130 V120 A12,12 0 0 1 862.0,120 V130" fill="none" stroke="#10151B" stroke-width="5"/><rect x="830.0" y="128" width="40" height="30" rx="5" fill="#10151B"/><text x="782" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#10151B" text-anchor="start"><tspan x="782" dy="0">Locks the room</tspan></text><text x="782" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5A6270" text-anchor="start"><tspan x="782" dy="0">Runs tools you</tspan><tspan x="782" dy="19">don’t trust where</tspan><tspan x="782" dy="19">they can’t see your</tspan><tspan x="782" dy="19">personal files.</tspan></text></svg>
