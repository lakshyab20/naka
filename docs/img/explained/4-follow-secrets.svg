<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Tripline follows a secret and stops it leaving, even when it is disguised"><title>Tripline follows a secret and stops it leaving, even when it is disguised</title><rect width="960" height="400" rx="18" fill="#F7F5EF"/><text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#10151B" text-anchor="start"><tspan x="32" dy="0">1. The AI reads a file. Tripline notes the key as it passes by.</tspan></text><rect x="24" y="66" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#DCD7CC" stroke-width="1.5"/><line x1="124" y1="88" x2="124" y2="98" stroke="#10151B" stroke-width="3"/><circle cx="124" cy="85" r="4" fill="#10151B"/><rect x="96" y="98" width="56" height="44" rx="10" fill="#10151B"/><circle cx="113" cy="118" r="5" fill="#FFFFFF"/><circle cx="135" cy="118" r="5" fill="#FFFFFF"/><rect x="114" y="130" width="20" height="4" rx="2" fill="#FFFFFF"/><text x="124" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10151B" text-anchor="middle"><tspan x="124" dy="0">AI assistant</tspan></text><rect x="380" y="66" width="200" height="110" rx="16" fill="#DDF1EE" stroke="#0F766E" stroke-width="2.5"/><g transform="translate(424,118) scale(0.42)"><path d="M0,-52 L42,-36 V2 C42,30 22,46 0,56 C-22,46 -42,30 -42,2 V-36 Z" fill="#0F766E"/><path d="M-16,2 L-4,14 L18,-12" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="458" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E" text-anchor="start"><tspan x="458" dy="0">Tripline</tspan></text><rect x="458" y="128" width="104" height="28" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/><text