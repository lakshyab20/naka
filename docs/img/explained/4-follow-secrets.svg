text-anchor="start"><tspan x="756" dy="0">never sent</tspan></text><line x1="228" y1="313" x2="376" y2="313" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round"/><path d="M376,313 L365.5,318.8 L365.5,307.2 Z" fill="#C2410C"/><line x1="584" y1="313" x2="732" y2="313" stroke="#DCD7CC" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"/><path d="M732,313 L721.5,318.8 L721.5,307.2 Z" fill="#DCD7CC"/><text x="32" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#C2410C" text-anchor="start"><tspan x="32" dy="0">Tripline recognises the same key in any disguise and blocks it.</tspan></text></svg>
