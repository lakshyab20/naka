<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Two ways an attack lives on, spreading to other AIs and coming back from memory, both blocked by Naka"><title>Two ways an attack lives on, spreading to other AIs and coming back from memory, both blocked by Naka</title><rect width="960" height="420" rx="18" fill="#F7F5EF"/><rect x="28" y="160" width="150" height="104" rx="6" fill="#FFFFFF" stroke="#10151B" stroke-width="2.5"/><path d="M28,164 L103.0,217.2 L178,164" fill="none" stroke="#10151B" stroke-width="2.5"/><rect x="44" y="214" width="118" height="36" rx="6" fill="#FBE7DC" stroke="#C2410C" stroke-width="2"/><text x="103" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C2410C" text-anchor="middle"><tspan x="103" dy="0">note</tspan></text><text x="103" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5A6270" text-anchor="middle"><tspan x="103" dy="0">An email with an</tspan><tspan x="103" dy="19">attacker&#x27;s note</tspan></text><line x1="184" y1="212" x2="240" y2="212" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/><path d="M240,212 L229.5,217.8 L229.5,206.2 Z" fill="#C2410C"/><rect x="246" y="150" width="150" height="124" rx="14" fill="#FFFFFF" stroke="#DCD7CC" stroke-width="1.5"/><line x1="321" y1="178" x2="321" y2="188" stroke="#10151B" stroke-width="3"/><circle cx="321" cy="175" r="4" fill="#10151B"/><rect x="293" y="188" width="56" height="44" rx="10" fill="#10151B"/><circle cx="310" cy="208" r="5" fill="#FFFFFF"/><circle cx="332" cy="208" r="5" fill="#FFFFFF"/><rect x="311" y="220" width="20" height="4" rx="2" fill="#FFFFFF"/><rect x="346" y="160" width="38" height="22" rx="5" fill="#C2410C"/><text x="365" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="365" dy="0">note</tspan></text><text x="321" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10151B" text-anchor="middle"><tspan x="321" dy="0">AI assistant</tspan></text><rect x="500" y="24" width="120" height="372" rx="18" fill="#DDF1EE" stroke="#0F766E" stroke-width="2.5"/><g transform="translate(560,210) scale(0.6)"><path d="M0,-52 L42,-36 V2 C42,30 22,46 0,56 C-22,46 -42,30 -42,2 V-36 Z" fill="#0F766E"/><path d="M-16,2 L-4,14 L18,-12" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="560" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E" text-anchor="middle"><tspan x="560" dy="0">Naka</tspan></text><path d="M398,190 C450,190 450,96 500,96" fill="none" stroke="#C2410C" stroke-width="3"/><circle cx="560" cy="96" r="20" fill="#C2410C"/><path d="M552.0,88.0 L568.0,104.0 M568.0,88.0 L552.0,104.0" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><line x1="622" y1="96" x2="690" y2="96" stroke="#DCD7CC" stroke-width="3" stroke-dasharray="6 6"/><rect x="696" y="40" width="240" height="112" rx="14" fill="#FFFFFF" stroke="#DCD7CC" stroke-width="1.5"/><text x="716" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#10151B" text-anchor="start"><tspan x="716" dy="0">1. Spreading</tspan></text><text x="716" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5A6270" text-anchor="start"><tspan x="716" dy="0">Copied into emails, comments</tspan><tspan x="716" dy="19">and chat that other AIs read</tspan></text><path d="M398,236 C450,236 450,326 500,326" fill="none" stroke="#C2410C" stroke-width="3"/><circle cx="560" cy="326" r="20" fill="#C2410C"/><path d="M552.0,318.0 L568.0,334.0 M568.0,318.0 L552.0,334.0" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><line x1="622" y1="326" x2="690" y2="326" stroke="#DCD7CC" stroke-width="3" stroke-dasharray="6 6"/><rect x="696" y="270" width="240" height="112" rx="14" fill="#FFFFFF" stroke="#DCD7CC" stroke-width="1.5"/><text x="716" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#10151B" text-anchor="start"><tspan x="716" dy="0">2. Coming back</tspan></text><text x="716" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5A6270" text-anchor="start"><tspan x="716" dy="0">Saved into its memory or</tspan><tspan x="716" dy="19">CLAUDE.md, read every day</tspan></text><text x="28" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F766E" text-anchor="start"><tspan x="28" dy="0">Naka remembers the words of everything</tspan><tspan x="28" dy="19">strangers wrote, so it spots the note however it leaves.</tspan></text></svg>
