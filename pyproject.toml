[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripline"
version = "0.2.0"
description = "Open-source, vendor-neutral runtime firewall for AI agents. Stops poisoned tools, rug-pulls and data leaks in MCP traffic."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Lakshya Bhardwaj" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["mcp", "ai-security", "prompt-injection", "llm", "agents", "firewall"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tripline = "tripline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
tripline = ["models/*.gz", "models/*.md", "data/*.json"]
