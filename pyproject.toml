[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naka"
version = "0.4.0"
description = "Open-source runtime firewall for AI agents. Stops poisoned tools, rug-pulls, data leaks, AI worms and memory poisoning in MCP traffic."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Lakshya Bhardwaj" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["mcp", "model-context-protocol", "ai-security", "prompt-injection", "llm", "agents", "firewall", "ai-worm", "memory-poisoning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/lakshyab20/naka"
Documentation = "https://github.com/lakshyab20/naka/tree/main/docs"
Issues = "https://github.com/lakshyab20/naka/issues"
Changelog = "https://github.com/lakshyab20/naka/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
naka = "naka.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
naka = ["models/*.gz", "models/*.md", "data/*.json", "data/*.txt"]
