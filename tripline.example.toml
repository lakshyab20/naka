# Tripline policy. Pass with: tripline wrap --config tripline.toml --name NAME -- <server>
# Every on_* option is "block" (stop it, tell the agent why) or "warn" (log it, let it through).

[policy]
# Instructions hidden in a tool's description or schema.
on_poisoned_tool = "block"
# A pinned tool's definition changed.
on_rug_pull = "block"
# A tool appeared after the server's first approved listing.
# "warn" pins it automatically; "block" holds it until `tripline pins approve`.
on_new_tool = "warn"
# Tool output contains instructions aimed at the model.
# "warn" lets it through with a warning label and turns on egress lockdown.
on_injected_response = "block"
# API keys, tokens or private keys in the arguments the agent sends.
on_secret_in_args = "block"
# Credentials in tool output (they are always tracked for data-flow checks).
on_secret_in_response = "warn"
# PAN, Aadhaar, card numbers or emails in arguments.
on_pii_in_args = "warn"
# A sensitive value read from tool A is sent through tool B.
on_tainted_flow = "block"
# After an injection attempt this session, tools that can send data out.
# "confirm" asks you in the app (MCP elicitation); see confirm_fallback.
on_egress_after_injection = "confirm"
# An address, URL, account or ID that came from untrusted tool output, used
# to decide where a state-changing tool sends or acts. block | warn | confirm
on_untrusted_destination = "confirm"
# Apps that can't show confirmation prompts: "block" or "warn".
confirm_fallback = "block"
# After untrusted content, ask before high-impact actions (payments, access,
# deletion, execution...). Strict mode asks before every state change.
confirm_sensitive_after_untrusted = true
confirm_after_untrusted = false
# "trust": pin each server's tools the first time it lists them.
# "confirm": ask before each tool's first call.
on_first_use = "trust"

# Injection score needed to flag text (high-severity rules score 3).
threshold = 3
# Text in one message above this size is blocked instead of scanned
# (scanning costs roughly 1 second per MB).
max_scan_bytes = 8000000
# After an injection attempt in this session: "egress" blocks tools that can
# send data out (by name, or any call carrying a URL, host, IP or email);
# "all" blocks every tool call that isn't allow-listed.
lockdown_scope = "egress"

# Optional ML classifier: "off", "builtin", or a path to a model file.
# "warn" labels flagged content and turns on lockdown; "block" withholds it.
classifier = "off"
classifier_action = "warn"
# Share data-flow state with the other servers the same app starts.
shared_session = true

# Tools whose output may decide destinations (e.g. your own contacts lookup).
trusted_tools = []
# Tools never treated as changing anything.
read_only_tools = []
# Tools that move data out, in addition to name-based guesses
# (send, post, email, upload, webhook, http, comment, message...).
egress_tools = []
# Trusted tools: never inspected.
allow_tools = []
# Tools that can never be listed or called.
deny_tools = []
